name: Purview DLP - Sensitive Data Policy Match
dataTypes:
  - o365
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Data Loss Prevention
technique: T1567 - Exfiltration Over Web Service
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1567/
  - https://learn.microsoft.com/en-us/purview/dlp-learn-about-dlp
  - https://learn.microsoft.com/en-us/purview/dlp-policy-reference
description: 'Une règle DLP Microsoft Purview a détecté des données sensibles (numéro AVS, données personnelles, informations confidentielles) dans un fichier OneDrive, SharePoint ou Exchange. L''événement indique qu''un utilisateur a tenté d''accéder ou partager un document contenant des informations protégées par les politiques nLPD/RGPD. Vérifier le fichier concerné via log.SharePointMetaData.FileName et la politique déclenchée via log.PolicyDetails.'
where: |-
  oneOf("action", ["DLPRuleMatch"])
afterEvents: []
groupBy: []
deduplicateBy: []
