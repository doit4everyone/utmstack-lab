name: Entra ID - Password Spray Attack
dataTypes:
  - o365
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: T1110.003 - Brute Force Password Spraying
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-ins
description: 'Détecte une attaque par password spray — un même mot de passe testé sur plusieurs comptes distincts depuis la même IP source. Contrairement au brute force (un compte, plusieurs mots de passe), le password spray cible de nombreux comptes avec un seul mot de passe courant pour éviter le verrouillage de compte. Vérifier si plusieurs utilisateurs distincts ont échoué depuis la même origin.ip dans une courte fenêtre temporelle.'
where: |-
  oneOf("action", ["UserLoginFailed"]) &&
  oneOf("log.Workload", ["AzureActiveDirectory"]) &&
  oneOf("log.LogonError", ["InvalidUserNameOrPassword"])
afterEvents: []
groupBy: []
deduplicateBy: []
