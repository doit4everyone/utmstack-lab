name: SOAR - Outbound Connection to Known Malicious IP (lab)
dataTypes:
  - syslog
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Command and Control
technique: T1071 - Application Layer Protocol
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1071/
  - https://doit4everyone.github.io/utmstack-lab/docs/05-soar.html
description: 'Un poste interne s''est connecté à une adresse IP classée malveillante par les listes de réputation d''UTMStack. Le SOAR (soar_ban.sh sur OPNsense) n''a pas banni cette adresse : pour une connexion sortante, un ban automatique risque de couper un service légitime quand la liste de réputation se trompe (constaté le 12 novembre 2026 sur une adresse Microsoft). Il a émis à la place le message syslog SOAR_OUTBOUND repris par cette règle. L''alerte n''est rattachée à aucun flow SOAR : elle reste ouverte jusqu''à son traitement. Next Steps: 1. Lire dans le message l''adresse du poste interne (origin) et l''adresse distante (ip). 2. Identifier le propriétaire de l''adresse distante (RDAP : https://rdap.arin.net/registry/ip/<ip>) : un grand fournisseur (Microsoft, Google, Amazon, Cloudflare) indique le plus souvent une erreur de la liste de réputation. 3. Sur le poste, retrouver le processus à l''origine de la connexion (Sysmon EID 3 et 22, cache DNS, Get-NetTCPConnection). 4. Si l''adresse est réellement malveillante, isoler le poste, puis bannir l''adresse à la main (cscli decisions add --ip <ip> --duration 24h --reason manual). 5. Si c''est une erreur de la liste, clore l''alerte en notant le propriétaire de l''adresse.'
where: |-
  contains("raw", "SOAR_OUTBOUND")
afterEvents: []
groupBy: []
deduplicateBy: []
