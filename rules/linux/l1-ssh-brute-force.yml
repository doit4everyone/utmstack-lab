name: L1 - SSH Authentication Failure
dataTypes:
  - linux
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Authentication
technique: T1110.001 - Brute Force Password Guessing
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1110/001/
description: 'Un échec d''authentification SSH a été détecté sur un serveur Linux via les events auditd (USER_AUTH fail). Détecte les tentatives d''authentification SSH échouées sur les comptes valides et invalides. Next Steps: 1. Identifier l''adresse IP source via log.userauth.addr. 2. Vérifier si plusieurs échecs proviennent de la même IP. 3. Bloquer l''IP source si le pattern est confirmé (fail2ban, CrowdSec). 4. Vérifier si une connexion réussie a suivi les échecs. 5. Auditer les comptes valides sur la machine cible.'
where: |-
  equals("action", "USER_AUTH") &&
  contains("log.userauth.result", "fail") &&
  regexMatch("log.userauth.exe", "(?i)sshd")
afterEvents: []
groupBy: []
deduplicateBy: []
